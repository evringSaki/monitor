<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场A上新监控 · 云端面板</title>
<style>
:root{--bg:#0f1420;--card:#171e2e;--card2:#1d2540;--line:#2a3454;--txt:#e8ecf5;--dim:#8b95ad;--acc:#4f8cff;--ok:#2ecc71;--bad:#ff5252}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:20px;display:flex;align-items:center;gap:10px}
h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.sub{color:var(--dim);font-size:12px;margin:6px 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .k{color:var(--dim);font-size:11px;margin-bottom:4px}
.card .v{font-size:20px;font-weight:600}
.card .v small{font-size:11px;color:var(--dim);font-weight:400}
.alert{background:linear-gradient(90deg,#123b23,#17de6e22);border:1px solid #1f6b3a;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:none}
.alert.show{display:block}
.alert b{color:var(--ok)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
button{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
button:disabled{opacity:.5}
label.chk{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:12px;cursor:pointer}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th{text-align:left;color:var(--dim);font-size:11px;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;font-size:12px;border-bottom:1px solid #202944}
tr:hover td{background:#1a2238}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10px;margin-right:3px}
.tag.main{background:#1c3a6e;color:#7fb0ff}
.tag.stage{background:#3d2f14;color:#ffce67}
.tag.new{background:#12402a;color:#4ade80}
a{color:var(--acc);text-decoration:none}
.empty{text-align:center;color:var(--dim);padding:30px}
#err{color:var(--bad);font-size:12px;margin:8px 0;display:none}
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span>场A上新监控 · 云端面板 <button style="margin-left:auto" onclick="load(true)">⟳ 刷新</button></h1>
<div class="sub">数据源：GitHub 仓库快照（Actions 每 5 分钟更新）· 本页每 5 分钟自动刷新 · 手机/电脑随时打开</div>

<div class="alert" id="alert"></div>

<div class="stats">
<div class="card"><div class="k">商品总数</div><div class="v" id="stTotal">-</div></div>
<div class="card"><div class="k">当前场次</div><div class="v" id="stStage">-</div></div>
<div class="card"><div class="k">快照时间（北京）</div><div class="v" id="stTime" style="font-size:13px">-</div></div>
</div>

<div class="toolbar">
<select id="src" onchange="render()">
<option value="stage" selected>⏰ 时段商品</option>
<option value="main">楼层商品</option>
<option value="all">全部</option>
</select>
<input id="q" placeholder="筛选商品名 / SKU / 店铺…" style="min-width:200px" oninput="render()">
<input id="pmin" type="number" placeholder="价格≥" style="width:80px" oninput="render()">
<input id="pmax" type="number" placeholder="价格≤" style="width:80px" oninput="render()">
<label class="chk"><input type="checkbox" id="onlyNew" onchange="render()">只看新上</label>
</div>

<table>
<thead><tr><th>商品 <span id="shownCnt" style="color:var(--acc)"></span></th><th>价格</th><th>库存/限购</th><th>店铺</th><th>SKU</th><th>链接</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<div class="empty" id="empty" style="display:none">快照暂无数据</div>
<div id="err"></div>

<script>
const RAW = 'https://raw.githubusercontent.com/evringSaki/monitor/main/data/snapshot.json';
let DATA = { total: 0, products: {} };

function utcToBJ(t) {
  if (!t) return '-';
  const d = new Date(t);
  return new Date(d.getTime() + 8 * 3600e3).toISOString().replace('T', ' ').slice(0, 16);
}

async function load(manual) {
  const btn = document.querySelector('h1 button');
  if (manual) { btn.disabled = true; btn.textContent = '拉取中…'; }
  try {
    const res = await fetch(RAW + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    document.getElementById('err').style.display = 'none';
    document.getElementById('dot').style.background = 'var(--ok)';
    render();
  } catch (e) {
    document.getElementById('err').textContent = '拉取失败: ' + e.message;
    document.getElementById('err').style.display = 'block';
    document.getElementById('dot').style.background = 'var(--bad)';
  }
  if (manual) { btn.disabled = false; btn.textContent = '⟳ 刷新'; }
}

function render() {
  const prods = Object.values(DATA.products || {});
  document.getElementById('stTotal').textContent = DATA.total || 0;
  document.getElementById('stTime').textContent = utcToBJ(DATA.time);

  const all = (DATA.stage && DATA.stage.all) || [];
  const cur = all.find(s => s.id === (DATA.stage && DATA.stage.id));
  document.getElementById('stStage').innerHTML = cur
    ? (cur.time || '').slice(11, 16) + ' <small>' + all.map(x => String(x.time || '').slice(11, 16)).filter(Boolean).join('→') + '</small>'
    : '-';

  const el = document.getElementById('alert');
  const newCnt = prods.filter(p => p.streak === 1 && (p.source === 'main' || p.source === 'stage')).length;
  if (newCnt > 0) { el.innerHTML = '🔔 <b>快照中有 ' + newCnt + ' 个本轮新上商品（NEW 标签）</b>'; el.classList.add('show'); }
  else el.classList.remove('show');

  const q = document.getElementById('q').value.trim().toLowerCase();
  const pmin = parseFloat(document.getElementById('pmin').value);
  const pmax = parseFloat(document.getElementById('pmax').value);
  const src = document.getElementById('src').value;
  const onlyNew = document.getElementById('onlyNew').checked;

  let list = prods.filter(p => {
    if (src === 'stage' && p.source !== 'stage') return false;
    if (src === 'main' && p.source !== 'main') return false;
    if (q && !((p.name || '') + p.sku + (p.shop || '')).toLowerCase().includes(q)) return false;
    const pr = parseFloat(p.price);
    if (!isNaN(pmin) && !(pr >= pmin)) return false;
    if (!isNaN(pmax) && !(pr <= pmax)) return false;
    if (onlyNew && p.streak !== 1) return false;
    return true;
  }).sort((a, b) => (b.source === 'main') - (a.source === 'main') || a.sku.localeCompare(b.sku));

  document.getElementById('shownCnt').textContent = '显示 ' + list.length + ' / ' + prods.length + ' 个';
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  document.getElementById('rows').innerHTML = list.map(p => {
    const tag = p.source === 'stage' ? '<span class="tag stage">时段</span>'
      : p.source === 'main' ? '<span class="tag main">楼层</span>' : '';
    const isNew = p.streak === 1 ? '<span class="tag new">NEW</span>' : '';
    const name = (p.name || '(未命名)').replace(/</g, '&lt;').slice(0, 46);
    const extra = [p.stock && '库存' + p.stock, p.limit && '限购' + p.limit].filter(Boolean).join(' / ') || '-';
    return '<tr><td>' + tag + isNew + ' ' + name + '</td>'
      + '<td><b>' + (p.price ? '￥' + p.price : '-') + '</b></td>'
      + '<td>' + extra + '</td>'
      + '<td>' + (p.shop || '-').slice(0, 18) + '</td>'
      + '<td style="color:var(--dim)">' + p.sku + '</td>'
      + '<td><a href="https://item.m.jd.com/product/' + p.sku + '.html" target="_blank">打开</a></td></tr>';
  }).join('');
}

load();
setInterval(load, 300000);
</script>
</body>
</html>
