name: 上新监控
# schedule 重新注册 touch

# 同一时间只允许一个监控运行，避免并发 push 造成快照冲突
concurrency:
  group: monitor-${{ github.ref }}
  cancel-in-progress: false

on:
  # 推送代码时立即触发（快照回写不触发，避免死循环）
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  # 定时触发（标准写法，GitHub 最稳）
  # 由 cron-job.org 每 5 分钟触发 repository_dispatch（下面这条 GitHub 自带定时已停用，
  # 两者同时启用会让每 5 分钟跑两次、互相抢着回写快照）
  # schedule:
  #   - cron: '*/5 * * * *'
  # 外部准时钟（cron-job.org）触发入口
  repository_dispatch:
    types: [monitor]
  # 允许手动触发（Actions 页面 → Run workflow）
  # 勾选 test_push 可只发一条 QQ 测试消息，用来验证推送链路是否真的能送达
  workflow_dispatch:
    inputs:
      test_push:
        description: '只发一条 QQ 测试消息（验证推送能否送达）'
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # 写回 snapshot.json 到仓库
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 首次运行创建 data 目录
        run: mkdir -p data

      - name: 执行监控-场A
        id: runA
        if: ${{ !inputs.test_push }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_QQ_TOKEN: ${{ secrets.PUSHPLUS_QQ_TOKEN }}
          PUSHPLUS_APP_TOKEN: ${{ secrets.PUSHPLUS_APP_TOKEN }}
          PAGE_URL: 'https://pro.m.jd.com/mall/active/6WUG9FgpNWoAAx9qRSPsmSiVcyt/index.html'
          STATE_PATH: ./data/snapshot.json
          LOG_PATH: ./data/history.log
          PAGE_LABEL: '场A'
          LOOP_TIMES: '5'
          LOOP_INTERVAL: '60000'
        run: |
          echo "=== 场A 开始 $(date -Iseconds) ==="
          node loop.js || echo "退出码 $?（1=有更新，属正常）"
          echo "=== 场A 完成 ==="

      - name: 推送链路测试
        id: runTest
        if: ${{ inputs.test_push }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_QQ_TOKEN: ${{ secrets.PUSHPLUS_QQ_TOKEN }}
          PUSHPLUS_APP_TOKEN: ${{ secrets.PUSHPLUS_APP_TOKEN }}
          LOG_PATH: ./data/history.log
          QMSG_TEST: '1'
        run: |
          echo "=== 测试开始 $(date -Iseconds) ==="
          node monitor.js
          echo "=== 测试完成 ==="

      - name: 回写快照到仓库
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更，跳过 commit"
            exit 0
          fi
          git commit -m "chore: 更新监控快照 $(date -Iseconds)"
          # 并发/远端已前进时的稳健回写：
          #   1) fetch 远端
          #   2) git reset（mixed）把索引对齐到远端最新，工作区的快照文件保持不变
          #   3) 重新 add data/ 形成"远端代码 + 本地快照"的提交
          # 这样不会因为 rebase 冲突而拿着旧 HEAD 反复被拒
          for i in 1 2 3 4; do
            git fetch origin main --quiet || true
            git reset --quiet origin/main 2>/dev/null || true
            git add -f data/ 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "快照已与远端一致"
              exit 0
            fi
            git commit -q -m "chore: 更新监控快照 $(date -Iseconds)" || true
            if git push origin HEAD:main; then
              echo "已提交新快照"
              exit 0
            fi
            echo "推送失败，${i}/4 次，5 秒后重试"
            sleep 5
          done
          echo "回写快照失败（不影响监控推送）"
          exit 0
