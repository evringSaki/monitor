name: 上新监控

on:
  # 推送代码时立即触发（快照回写不触发，避免死循环）
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  # 定时触发（标准写法，GitHub 最稳）
  schedule:
    - cron: '*/5 * * * *'        # 每 5 分钟
    # 开抢时段加密（UTC 11:55-12:10 = 北京 19:55-20:10）
    # 让 20:00 场切换后第一时间就被抓到，避免"迟到 5 分钟"
    - cron: '55,57,59 11 * * *'
    - cron: '0,2,4,6,8,10 12 * * *'
  # 允许手动触发（Actions 页面 → Run workflow）
  # 勾选 test_push 可只发一条 QQ 测试消息，用来验证推送链路是否真的能送达
  workflow_dispatch:
    inputs:
      test_push:
        description: '只发一条 QQ 测试消息（验证推送能否送达）'
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # 写回 snapshot.json 到仓库
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 首次运行创建 data 目录
        run: mkdir -p data

      - name: 执行监控-场A
        id: runA
        if: ${{ !inputs.test_push }}
        env:
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PAGE_URL: 'https://pro.m.jd.com/mall/active/6WUG9FgpNWoAAx9qRSPsmSiVcyt/index.html'
          STATE_PATH: ./data/snapshot.json
          LOG_PATH: ./data/history.log
          PAGE_LABEL: '场A'
        run: |
          echo "=== 场A 开始 $(date -Iseconds) ==="
          node monitor.js || echo "退出码 $?（1=有更新，属正常）"
          echo "=== 场A 完成 ==="

      - name: 执行监控-场B今日抢购
        id: runBToday
        if: ${{ !inputs.test_push }}
        env:
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          JD_COOKIE: ${{ secrets.JD_COOKIE }}
          PAGE_URL: 'https://pro.m.jd.com/mall/active/USFY4Q1KPsHd54cN8AVUPHZdHpT/index.html?babelChannel=ttt3&homepagebybt=1&secJump=1&visitScene=1'
          STATE_PATH: ./data/b-today-snapshot.json
          LOG_PATH: ./data/history.log
          PAGE_LABEL: '场B今日'
          MODE: 'today'
        run: |
          echo "=== 场B今日抢购 开始 $(date -Iseconds) ==="
          if [ -z "$JD_COOKIE" ]; then
            echo "未配置 JD_COOKIE Secret，跳过（GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret → Name: JD_COOKIE）"
          else
            node monitor.js || echo "退出码 $?（1=有更新，属正常）"
          fi
          echo "=== 场B今日抢购 完成 ==="

      - name: 推送链路测试
        id: runTest
        if: ${{ inputs.test_push }}
        env:
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          LOG_PATH: ./data/history.log
          QMSG_TEST: '1'
        run: |
          echo "=== 测试开始 $(date -Iseconds) ==="
          node monitor.js
          echo "=== 测试完成 ==="

      - name: 回写快照到仓库
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ 2>/dev/null || true
          # 仅当有变更时提交
          if git diff --cached --quiet; then
            echo "无变更，跳过 commit"
          else
            git commit -m "chore: 更新监控快照 $(date -Iseconds)"
            git pull --rebase --autostash 2>/dev/null || true
            git push
            echo "已提交新快照"
          fi
