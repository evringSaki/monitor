name: price-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 带cookie抓活动页，验证是否含实时价
        env:
          JD_COOKIE: ${{ secrets.JD_COOKIE }}
        run: |
          echo "cookie 长度: ${#JD_COOKIE}"
          curl -s -m 25 -A "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36" \
            -H "Referer: https://pro.m.jd.com/" \
            -b "$JD_COOKIE" \
            "https://pro.m.jd.com/mall/active/6WUG9FgpNWoAAx9qRSPsmSiVcyt/index.html" -o /tmp/a.html -w "HTTP %{http_code} size %{size_download}\n"
          echo "=== 已知实时价关键词检查（419.5 蔻驰 / 159 卡西欧 / 149 网球王子 / 99 ibaby） ==="
          for kw in 419.5 4195 159 149; do echo -n "$kw: "; grep -c "$kw" /tmp/a.html || echo 0; done
          echo "=== skuPriceInfo 出现次数 ==="
          grep -c 'skuPriceInfo' /tmp/a.html || echo 0
          echo "=== skuPriceInfo 样本 ==="
          grep -o 'skuPriceInfo[^}]\{0,120\}' /tmp/a.html | head -4 || echo 无
          echo "=== promoPrice 非空样本 ==="
          grep -o '"promoPrice":"[0-9.]*"' /tmp/a.html | sort | uniq -c | sort -rn | head -8 || echo 无
          echo "=== regularPrice 样本 ==="
          grep -o '"regularPrice":[0-9.]*' /tmp/a.html | sort | uniq -c | sort -rn | head -8 || echo 无
