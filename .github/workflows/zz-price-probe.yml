name: price-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 测试价格来源
        run: |
          echo "=== item.m.jd.com 跟随重定向 ==="
          curl -sL -m 25 -A "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36" \
            -e "https://pro.m.jd.com/" \
            "https://item.m.jd.com/product/100302423051.html" -o /tmp/item.html -w "final %{url_effective} HTTP %{http_code} size %{size_download}\n"
          grep -c '419\.5' /tmp/item.html || echo "无 419.5"
          grep -o '"p":"[0-9.]*"' /tmp/item.html | head -8 || true
          grep -o '"price":"\?[0-9.]*"\?' /tmp/item.html | head -8 || true
          grep -o 'window\._itemOnly[^<]\{0,200\}' /tmp/item.html | head -2 || true
          echo "=== PC 商品页 ==="
          curl -sL -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://item.jd.com/100302423051.html" -o /tmp/pc.html -w "final %{url_effective} HTTP %{http_code} size %{size_download}\n"
          grep -c '419\.5' /tmp/pc.html || echo "无 419.5"
          grep -o '"op":"[0-9.]*"\|"m":"[0-9.]*"\|"p":"[0-9.]*"' /tmp/pc.html | head -8 || true
          echo "=== 移动端 SSR 接口 ==="
          curl -s -m 20 -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" \
            "https://wqitem.jd.com/item/view?sku=100302423051" -o /tmp/wq.html -w "HTTP %{http_code} size %{size_download}\n"
          grep -c '419\.5' /tmp/wq.html || echo "无 419.5"
